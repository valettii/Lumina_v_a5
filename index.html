<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>LUMINA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0A0A0C; --accent:#E2E8F0; --surface:#111218; --surface2:#181A22; --track:#1A1C23;
  --muted:#64748B;
  --fire:#EF4444; --earth:#10B981; --air:#3B82F6; --water:#8B5CF6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--accent)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;border:0;padding:0;color:inherit;background:none;cursor:pointer;text-align:inherit}
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:480px;pointer-events:none;z-index:0;
  background:linear-gradient(to bottom,rgba(29,63,191,.36),rgba(29,63,191,0));
}
#app{position:relative;z-index:1}
.screen{
  max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(max(var(--app-top,0px),env(safe-area-inset-top,0px)) + 14px) 16px
          calc(max(var(--tg-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px)) + 48px);
}
.enter{animation:enter .28s cubic-bezier(.22,.61,.36,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;gap:12px;min-height:40px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--accent);
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px;flex:none}
.icon-spacer{width:40px;flex:none}
.top-title{flex:1;text-align:center;font-size:11px;letter-spacing:.18em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.clock{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

.brand{font-size:46px;font-weight:200;letter-spacing:.26em;margin:22px 0 0}
.brand-sub{color:var(--muted);font-size:13px;letter-spacing:.2em;margin-top:6px}
.section{font-size:12px;letter-spacing:.22em;color:var(--muted);margin:26px 0 10px;text-transform:uppercase}
.label{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.body{font-size:14px;line-height:1.55;color:rgba(226,232,240,.9)}
.muted{color:var(--muted)}
.error{color:#F87171;font-size:13px;margin-top:10px}
.error:empty{display:none}

.card{background:var(--surface);border-radius:20px;padding:18px}
.btn{display:block;width:100%;border-radius:16px;padding:15px;font-size:13px;font-weight:800;letter-spacing:.2em;text-align:center;
  transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.85}
.btn-solid{background:var(--accent);color:var(--bg);margin-top:12px}
.btn-soft{background:var(--surface2);color:var(--accent);font-weight:700;letter-spacing:.16em;margin-top:6px}
.btn-ghost{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.18em;padding:14px;margin-top:8px}
.btn-danger{background:rgba(239,68,68,.16);color:#F87171;font-weight:700;letter-spacing:.16em}
.btn-cancel{background:var(--surface2);color:var(--accent);font-weight:700;letter-spacing:.16em}

.input{width:100%;background:var(--surface2);border:0;border-radius:16px;color:var(--accent);font-size:16px;
  padding:14px 16px;outline:none;font-family:inherit;transition:box-shadow .15s}
.input::placeholder{color:var(--muted)}
.input:focus{box-shadow:0 0 0 1px rgba(226,232,240,.28)}
.input.page{background:var(--surface)}
.field-label{margin:0 0 10px}

/* кольцо окна */
.hero{display:block;margin:18px auto 0;cursor:pointer;width:min(calc(100vw - 56px),320px)}
.ring{position:relative;width:100%;aspect-ratio:1/1}
.ring svg{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-cap{font-size:10px;letter-spacing:.3em;color:var(--muted)}
.ring-time{font-size:min(62px,17.5vw);font-weight:200;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.05}
.ring-name{font-size:15px;font-weight:600;letter-spacing:.14em;margin-top:8px}
.ring-int{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

.brief{display:block;width:100%;cursor:pointer}
.brief-title{font-size:26px;font-weight:600;margin:26px 0 0;line-height:1.2}
.brief-text{color:var(--muted);font-size:15px;line-height:1.5;margin-top:8px}
.ground{display:flex;gap:14px;margin-top:18px}
.bar{width:3px;border-radius:2px;flex:none}
.more{font-size:11px;letter-spacing:.2em;color:var(--muted);text-align:right;margin-top:12px}

.tiles{display:flex;gap:12px}
.tile{flex:1;background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;min-width:0;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile-num{font-size:34px;font-weight:300;margin-top:10px}
.tile-name{font-size:13px;letter-spacing:.16em;margin-top:2px}
.tile-el{font-size:10px;font-weight:700;letter-spacing:.2em;margin-top:10px}

.dial-wrap{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.dial{position:relative;width:220px;height:220px}
.dial svg{width:100%;height:100%;display:block}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial-num{font-size:40px;font-weight:200}
.legend{display:flex;flex-wrap:wrap;justify-content:center;margin-top:14px}
.legend span{display:flex;align-items:center;margin:2px 8px;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.legend .dot{width:8px;height:8px;margin-right:6px}

.log{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin-top:8px}
.log-bar{width:4px;border-radius:2px;flex:none}
.log-text{font-size:14px;word-break:break-word}
.log-meta{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 4px}

.prow{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.prow:active{transform:scale(.99)}
.prow .pdot{width:10px;height:10px;border-radius:50%;flex:none}
.prow-main{flex:1;min-width:0}
.prow-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-meta{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.prow-del{font-size:11px;letter-spacing:.18em;color:var(--muted);padding:8px}

/* подробные экраны */
.dcard{border-radius:20px;background:var(--surface);padding:20px;margin-top:10px}
.dcard-top{display:flex;justify-content:space-between;align-items:center}
.d-num{font-size:34px;font-weight:300}
.tag{font-size:11px;font-weight:700;letter-spacing:.2em;border:1px solid;border-radius:6px;padding:3px 8px}
.d-name{font-size:16px;letter-spacing:.2em;margin-top:2px}
.d-vec{font-size:18px;font-weight:600;margin-top:12px}
.d-int{font-size:14px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.d-timer{margin:16px 0 4px;padding:16px 0;border-top:1px solid #1D1F27;border-bottom:1px solid #1D1F27;text-align:center}
.d-timer .big{font-size:48px;font-weight:200;font-variant-numeric:tabular-nums;margin-top:6px}
.dsec{margin-top:20px}
.dsec .label{margin-bottom:6px}
.dsec-bar{display:flex;gap:14px}
.wrow{display:flex;align-items:center;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wrow .dot{margin-right:10px;width:6px;height:6px}
.wrow .t{width:108px;flex:none}
.wrow.now{background:var(--surface);color:var(--accent);font-weight:700}

/* журнал */
.group-head{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);
  border-radius:14px;padding:13px 14px;margin-top:10px;font-size:14px;font-weight:700}
.group-head .cnt{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;margin-left:8px}
.group-head.month{box-shadow:inset 0 0 0 1px #2A2D38}
.indent{margin-left:12px}

/* окно подтверждения и уведомление */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;background:#14161D;border-radius:24px 24px 0 0;padding:24px 18px calc(max(var(--tg-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px)) + 22px);
  animation:up .25s cubic-bezier(.22,.61,.36,1) both}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:700}
.sheet-row{display:flex;gap:10px;margin-top:20px}
.sheet-row .btn{flex:1;margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(max(var(--tg-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px)) + 32px);
  transform:translateX(-50%);background:#1F2230;color:var(--accent);padding:12px 18px;border-radius:14px;font-size:13px;z-index:20;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.show{opacity:1}

/* пентада */
.pent{display:flex;align-items:center;gap:16px;width:100%;background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;transition:transform .12s}
.pent:active{transform:scale(.99)}
.pring{position:relative;width:96px;height:96px;flex:none}
.pring svg{width:100%;height:100%;display:block}
.pring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pbig{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.psmall{font-size:11px;color:var(--muted);margin-top:4px;min-height:13px}
.pmain{flex:1;min-width:0}
.pname{font-size:17px;font-weight:700;letter-spacing:.08em}
.psign{font-size:12px;color:var(--muted);margin-top:5px}
.ptitle{font-size:14px;margin-top:10px;color:rgba(226,232,240,.92);line-height:1.3}
.chev{color:var(--muted);font-size:24px;flex:none}

/* ───── правки v3 ───── */
.section{font-size:13px;font-weight:700;letter-spacing:.14em;color:#B4BECE;margin:26px 0 10px;text-transform:uppercase}
.sec-row{display:flex;justify-content:space-between;align-items:center}
.chev.sm{font-size:20px}
.top-center{flex:1;min-width:0;text-align:center}
.top-cap{font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.top-name{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.top-sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

/* раскрывающиеся блоки */
.acc{background:var(--surface);border-radius:20px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px;cursor:pointer}
.acc-main{flex:1;min-width:0}
.acc-title{font-size:14px;font-weight:700;letter-spacing:.08em;color:#D5DCE8}
.acc-sub{font-size:13px;color:var(--muted);margin-top:5px}
.acc-sub .dot{width:7px;height:7px;margin:0 3px 1px 0}
.acc .chev{transition:transform .25s ease}
.acc.open > .acc-head .chev{transform:rotate(90deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc.open > .acc-body{grid-template-rows:1fr}
.acc-inner{min-height:0;overflow:hidden}
.acc-pad{padding:0 16px 16px}
.tiles.in-acc .tile{background:var(--surface2)}

/* блок «окно» целиком нажимается */
.blk{cursor:pointer;display:block}
.blk .section{margin-bottom:0}
.brief{display:block;width:100%}
.log.tap{cursor:pointer;align-items:center}
.log-main{flex:1;min-width:0}
.log .chev{flex:none}

/* Pro */
.btn-pro{display:flex;align-items:center;justify-content:space-between;background:var(--surface);color:var(--accent);
  box-shadow:inset 0 0 0 1px rgba(226,232,240,.2);margin-top:12px;letter-spacing:.16em}
.pro-badge{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--bg);background:var(--accent);border-radius:6px;padding:3px 7px;white-space:nowrap}
.proitem{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.proitem .check{color:var(--accent);font-size:13px;margin-top:2px}
.prorow{margin-top:14px}
.prorow.locked{opacity:.45}
#quickAcc.open .acc-sub{display:none}

/* ───── сутки ───── */
.dial-wrap{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.dial{position:relative;width:var(--d,190px);height:var(--d,190px)}
.dial svg{width:100%;height:100%;display:block}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial-num{font-size:calc(var(--d,190px) * .18);font-weight:200;line-height:1.1}
.legend{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}
.legend span{display:flex;align-items:center;margin:2px 8px;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.legend .dot{width:8px;height:8px;margin-right:6px}
.blkrow{display:flex;align-items:center;padding:11px 12px;border-radius:12px;background:var(--surface);margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.blkrow .dot{margin-right:12px}
.blkrow .t{width:116px;flex:none;color:var(--muted)}
.blkrow .n{flex:1}
.blkrow .r{color:var(--muted);font-size:12px}
.blkrow.now .t,.blkrow.now .n{color:var(--accent);font-weight:700}

/* ───── маяки ───── */
.beacon-banner{display:flex;align-items:center;gap:12px;background:rgba(226,232,240,.08);border-radius:16px;padding:12px 14px;margin-top:14px;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(226,232,240,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(226,232,240,.22)}50%{box-shadow:inset 0 0 0 1px rgba(226,232,240,.65)}}
.bb-time{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.bb-txt{flex:1;font-size:12px;font-weight:700;letter-spacing:.16em;color:#C3CCDA}
.beacon-line{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
.b-time{font-size:56px;font-weight:200;font-variant-numeric:tabular-nums;line-height:1}
.brow{display:flex;align-items:center;padding:11px 12px;border-radius:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
.brow .dot{margin-right:12px}
.brow .t{width:62px;flex:none}
.brow .n{flex:1}
.brow.next{background:var(--surface2);color:var(--accent);font-weight:700}

/* ───── заземление: три канала ───── */
.gcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcard{background:var(--surface);border-radius:20px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;transition:transform .12s}
.gcard:active{transform:scale(.97)}
.gicon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#C3CCDA}
.gicon svg{width:30px;height:30px}
.gicon.art svg{width:44px;height:44px;border-radius:10px}
.gtitle{font-size:11px;font-weight:700;letter-spacing:.12em;margin-top:10px}
.gsub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;min-height:28px}
.gbtn{margin-top:10px;background:var(--accent);color:var(--bg);border-radius:12px;padding:9px 2px;font-size:10px;font-weight:800;letter-spacing:.05em;width:100%}
.log-kind{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.log-thumb{flex:none;margin-left:10px}
.log-thumb svg{width:44px;height:44px;border-radius:10px;display:block}
.beta{font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--bg);background:#F59E0B;border-radius:5px;padding:2px 5px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:14px}
#ov{position:relative;z-index:50}
.sheet-big{font-size:20px;font-weight:600;line-height:1.35;margin-top:14px}
.btn-ok{background:var(--accent);color:var(--bg)}
.move-timer{margin-top:20px;text-align:center}
.mt-num{font-size:64px;font-weight:200;font-variant-numeric:tabular-nums}
.mt-bar{height:3px;background:#1D1F27;border-radius:2px;margin-top:14px;overflow:hidden}
.mt-bar i{display:block;height:100%;width:0;background:var(--accent)}

/* резонанс */
.res{position:fixed;inset:0;z-index:60;background:#05060A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fade .3s both}
.res-x{position:absolute;top:calc(max(var(--app-top,0px),env(safe-area-inset-top,0px)) + 14px);right:16px;width:40px;height:40px;border-radius:50%;background:var(--surface);font-size:24px;line-height:1;color:var(--accent);text-align:center}
.res-cap{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:26px}
.res-tri{display:flex;gap:12px}
.res-card{background:none;border-radius:16px;padding:0;transition:transform .15s}
.res-card:active{transform:scale(.96)}
.res-card svg{display:block;border-radius:16px;box-shadow:0 0 0 1px rgba(226,232,240,.14);max-width:28vw;height:auto}
.res-art{animation:breathe 10s ease-in-out infinite}
.res-art svg{display:block;border-radius:24px;max-width:78vw;height:auto;box-shadow:0 0 60px rgba(29,63,191,.35)}
@keyframes breathe{0%{transform:scale(.94)}40%{transform:scale(1.06)}100%{transform:scale(.94)}}
.res-thought{margin-top:34px;text-align:center;max-width:320px;min-height:90px}
.tl{font-size:19px;font-weight:300;line-height:1.4;opacity:0;animation:tl 1.4s ease-out both}
@keyframes tl{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.res-bar{position:absolute;left:24px;right:24px;bottom:calc(max(var(--tg-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px)) + 28px);height:2px;background:#1D1F27;border-radius:2px;overflow:hidden}
.res-bar i{display:block;height:100%;width:0;background:var(--accent);animation:bar 15s linear both}
@keyframes bar{from{width:0}to{width:100%}}

/* верхняя панель: действия и настройки */
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn.sm{width:36px;height:36px;padding-bottom:0}
.icon-btn svg{width:18px;height:18px}
.setrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px}
.sw{width:50px;height:30px;border-radius:15px;background:#2A2D38;position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--accent);transition:transform .2s}
.sw.on{background:#3B82F6}
.sw.on i{transform:translateX(20px)}

/* ───── старт, заглушки, подсказки ───── */
.start-title{font-size:40px;font-weight:200;letter-spacing:.2em;text-align:center;margin-top:64px;white-space:nowrap}
.start-title span{color:var(--muted)}
.pills{display:flex;gap:10px;overflow-x:auto;margin:30px -16px 0;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--surface);color:var(--accent);border-radius:999px;padding:13px 20px;font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;transition:transform .12s}
.pill:active{transform:scale(.97)}
.pill.main{background:var(--accent);color:var(--bg);font-weight:700}

.br-glow{stroke:#60A5FA;stroke-opacity:.35;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 86;animation:brrun 9s linear infinite}

@keyframes brrun{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}

// ───────────────────────── 2. КАЛЬКУЛЯТОР ─────────────────────────
const REGISTER_COUNT = 72;
const PENTAD_DEG = 5;
const WINDOW_MIN = 20;
const PRECESSION_OFFSET = 33;

const pad2 = (n        )         => (n < 10 ? '0' + n : String(n));

/** Разбор ДД.ММ.ГГГГ с проверкой реальности даты. */
function parseBirthDate(input        )                    {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(input.trim());
  if (!m) return null;
  const day = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  const year = parseInt(m[3], 10);
  const d = new Date(Date.UTC(year, month - 1, day));
  const valid =
    d.getUTCFullYear() === year &&
    d.getUTCMonth() === month - 1 &&
    d.getUTCDate() === day;
  if (!valid) return null;
  if (year < 1900 || d.getTime() > Date.now()) return null;
  return { day, month, year };
}

/** Дата без времени -> 12:00 UT (минимальная погрешность при неизвестном часе). */
function birthDateToUTC(p            )       {
  return new Date(Date.UTC(p.year, p.month - 1, p.day, 12, 0, 0));
}

/** Эклиптическая долгота Солнца: Юлианская дата + уравнение центра. */
function calculateSunLongitude(birthDate      )         {
  const year = birthDate.getUTCFullYear();
  const month = birthDate.getUTCMonth(); // 0-indexed
  const day = birthDate.getUTCDate();
  const hours = birthDate.getUTCHours();
  const minutes = birthDate.getUTCMinutes();

  const dayFraction = day + (hours + minutes / 60) / 24;

  let y = year;
  let m = month + 1;
  if (m <= 2) {
    y -= 1;
    m += 12;
  }

  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  const JD =
    Math.floor(365.25 * (y + 4716)) +
    Math.floor(30.6001 * (m + 1)) +
    dayFraction +
    B -
    1524.5;

  const d = JD - 2451545.0;

  let L = (280.46 + 0.9856474 * d) % 360;
  if (L < 0) L += 360;

  let g = ((357.528 + 0.9856003 * d) % 360) * (Math.PI / 180);
  if (g < 0) g += 2 * Math.PI;

  const lambdaSun = L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g);
  return ((lambdaSun % 360) + 360) % 360;
}

/** Физическое ядро N_phys (1–72). */
function calculatePhysicalRegister(birthDate      )         {
  const lambdaSun = calculateSunLongitude(birthDate);
  const registerIndex = Math.floor(lambdaSun / PENTAD_DEG) + 1;
  return Math.max(1, Math.min(REGISTER_COUNT, registerIndex));
}

/** Эволюционный вектор N_evol (1–72), 1984 -> 46. */
function calculateEvolutionaryRegister(year        )         {
  const shifted = year - 1900 + PRECESSION_OFFSET;
  return (((shifted % REGISTER_COUNT) + REGISTER_COUNT) % REGISTER_COUNT) + 1;

/** Активный регистр циркадного окна по локальному времени устройства. */
function getActiveRegisterId(now      )         {
  const mTotal = now.getHours() * 60 + now.getMinutes();
  return Math.min(REGISTER_COUNT, Math.floor(mTotal / WINDOW_MIN) + 1);
}

/** Секунд до конца текущего 20-минутного окна. */
function getSecondsToWindowEnd(now      )         {
  const mTotal = now.getHours() * 60 + now.getMinutes();
  const endMin = (Math.floor(mTotal / WINDOW_MIN) + 1) * WINDOW_MIN;
  return Math.max(0, endMin * 60 - (mTotal * 60 + now.getSeconds()));
}

/** Миллисекунд до конца текущего 20-минутного окна (для плавной дуги). */
function getMsToWindowEnd(now      )         {
  const mTotal = now.getHours() * 60 + now.getMinutes();
  const endMin = (Math.floor(mTotal / WINDOW_MIN) + 1) * WINDOW_MIN;
  const elapsed = mTotal * 60000 + now.getSeconds() * 1000 + now.getMilliseconds();
  return Math.max(0, endMin * 60000 - elapsed);
}

function formatClock(d      )         {
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function localDateKey(d      )         {

function minutesToClock(totalMinutes        )         {
  return pad2(Math.floor(totalMinutes / 60)) + ':' + pad2(totalMinutes % 60);
}

const RECENT_DAYS = 7;

/** Последние 7 дней — группы по дням; всё старше — группы по месяцам, внутри по дням. */
function groupJournal(logs            , now      )                                               {
  const sorted = [...logs].sort(
    (a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime()
  );
  const recent             = [];
  const months               = [];

  for (const entry of sorted) {
    const d = new Date(entry.timestamp);
    const dayKey = localDateKey(d);
    const isRecent = dayDiff(now, d) < RECENT_DAYS;

    if (isRecent) {
      let g = recent.find((x) => x.key === dayKey);
      if (!g) {
        g = { key: dayKey, label: dayLabel(d, now), entries: [] };
        recent.push(g);
      }
      g.entries.push(entry);
    } else {
      const monthKey = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      let mg = months.find((x) => x.key === monthKey);
      if (!mg) {
        mg = { key: monthKey, label: MONTHS_NOM[d.getMonth()] + ' ' + d.getFullYear(), count: 0, days: [] };
        months.push(mg);
      }
      mg.count += 1;
      let g = mg.days.find((x) => x.key === dayKey);
      if (!g) {
        g = { key: dayKey, label: dayLabel(d, now), entries: [] };
        mg.days.push(g);
      }
      g.entries.push(entry);
    }
  }
  return { recent, months };
}

// ───────── Образы: абстрактные SVG по описанию визуала из матрицы ─────────
let artUid = 0;
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function artKind(text) {
  const t = text.toLowerCase();
  if (/октагон|восьмиугольн|щит|титан/.test(t)) return 'octagon';
  if (/звезд|ночн|небо|неба/.test(t)) return 'night';
  if (/хрусталь|кварц|алмаз|пирит|куб|лезви|грань|граней|граня|граненый|кристалл|жеод|геометр|матриц/.test(t)) return 'crystal';
  if (/рассвет|закат|вершин|гор[аыу]\b|горизонт|равнин/.test(t)) return 'peak';
  if (/капл|роса|росы|вод[аыуой]|источник|поток|коралл/.test(t)) return 'drops';
  if (/росток|семя|зерно|мох|древес|стебл|перо|спираль/.test(t)) return 'sprout';
  if (/сфера|шар|пламя|свечени|свет|луч|янтарь|золот|радуг|песок/.test(t)) return 'glow';
  if (/гранит|монолит|окатыш|галька|агат|базальт|обсидиан|метеорит|камень|камня|халцедон|столб|башн|чаш/.test(t)) return 'stone';
  return 'crystal';
}
function artSVG(regId, size) {
  const reg = REGISTERS[regId - 1];
  const color = EL_COLOR[reg.element];
  const text = MATRIX[regId - 1][4];
  const kind = artKind(text);
  const rnd = mulberry(regId * 7919 + 13);
  const id = 'a' + (artUid++);
  const P = (x, y) => x.toFixed(1) + ',' + y.toFixed(1);
  let s = '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><radialGradient id="' + id + 'b" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="' + color + '" stop-opacity=".34"/><stop offset="1" stop-color="#0A0A0C" stop-opacity="1"/></radialGradient>' +
    '<radialGradient id="' + id + 'g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="' + color + '" stop-opacity=".85"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="' + id + 's" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4d"/><stop offset="1" stop-color="#10121a"/></linearGradient></defs>' +
    '<rect width="120" height="120" rx="14" fill="#0A0A0C"/><rect width="120" height="120" rx="14" fill="url(#' + id + 'b)"/>';
  if (kind === 'crystal') {
    const n = 6 + Math.floor(rnd() * 3), pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 2 * Math.PI - Math.PI / 2 + (rnd() - 0.5) * 0.35;
      const r = 38 * (0.82 + rnd() * 0.3);
      pts.push([60 + r * Math.cos(a), 60 + r * Math.sin(a)]);
    }
    s += '<ellipse cx="60" cy="60" rx="46" ry="46" fill="url(#' + id + 'g)" opacity=".5"/>';
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      s += '<polygon points="' + P(60, 60) + ' ' + P(p[0], p[1]) + ' ' + P(q[0], q[1]) + '" fill="' + color + '" fill-opacity="' + (0.12 + rnd() * 0.5).toFixed(2) + '" stroke="#E2E8F0" stroke-opacity=".28" stroke-width=".6"/>';
    }
    s += '<polygon points="' + pts.map((p) => P(p[0], p[1])).join(' ') + '" fill="none" stroke="#E2E8F0" stroke-opacity=".55" stroke-width="1"/>';
    s += '<line x1="' + (30 + rnd() * 60).toFixed(1) + '" y1="6" x2="60" y2="60" stroke="#E2E8F0" stroke-opacity=".35" stroke-width="1"/>';
  } else if (kind === 'octagon') {
    const oct = (r, rot) => Array.from({ length: 8 }, (_, i) => { const a = (i / 8) * 2 * Math.PI + rot; return P(60 + r * Math.cos(a), 60 + r * Math.sin(a)); }).join(' ');
    s += '<ellipse cx="60" cy="60" rx="50" ry="50" fill="url(#' + id + 'g)" opacity=".45"/>' +
      '<polygon points="' + oct(46, Math.PI / 8) + '" fill="#0A0A0C" fill-opacity=".55" stroke="' + color + '" stroke-width="1.6"/>' +
      '<polygon points="' + oct(32, Math.PI / 8) + '" fill="' + color + '" fill-opacity=".14" stroke="#E2E8F0" stroke-opacity=".5" stroke-width="1"/>' +
      '<polygon points="' + oct(17, Math.PI / 8) + '" fill="' + color + '" fill-opacity=".35" stroke="#E2E8F0" stroke-opacity=".7" stroke-width=".8"/>' +
      '<circle cx="60" cy="60" r="2.2" fill="#E2E8F0"/>';
  } else if (kind === 'stone') {
    const tall = /монолит|столб|башн/.test(text.toLowerCase());
    s += tall
      ? '<rect x="' + (46 + rnd() * 4).toFixed(1) + '" y="20" width="' + (26 + rnd() * 6).toFixed(1) + '" height="82" rx="5" fill="url(#' + id + 's)" stroke="#E2E8F0" stroke-opacity=".15"/><rect x="50" y="24" width="4" height="70" rx="2" fill="#E2E8F0" fill-opacity=".1"/>'
      : '<ellipse cx="60" cy="68" rx="' + (30 + rnd() * 8).toFixed(1) + '" ry="' + (22 + rnd() * 6).toFixed(1) + '" fill="url(#' + id + 's)" stroke="#E2E8F0" stroke-opacity=".15"/><ellipse cx="50" cy="58" rx="9" ry="4" fill="#E2E8F0" fill-opacity=".12"/>';
    s += '<line x1="14" y1="102" x2="106" y2="102" stroke="' + color + '" stroke-opacity=".45"/>';
  } else if (kind === 'night') {
    for (let i = 0; i < 46; i++) s += '<circle cx="' + (rnd() * 120).toFixed(1) + '" cy="' + (rnd() * 90).toFixed(1) + '" r="' + (0.4 + rnd() * 1).toFixed(2) + '" fill="#E2E8F0" fill-opacity="' + (0.35 + rnd() * 0.6).toFixed(2) + '"/>';
    s += '<polygon points="60,66 40,104 80,104" fill="' + color + '" fill-opacity=".5" stroke="#E2E8F0" stroke-opacity=".5" stroke-width=".8"/><polygon points="60,66 60,104 80,104" fill="#0A0A0C" fill-opacity=".35"/>';
  } else if (kind === 'peak') {
    s += '<circle cx="' + (40 + rnd() * 40).toFixed(1) + '" cy="40" r="26" fill="url(#' + id + 'g)"/>' +
      '<polygon points="0,100 28,62 48,82 76,40 102,76 120,96 120,120 0,120" fill="#0F1117" stroke="#E2E8F0" stroke-opacity=".25" stroke-width=".8"/>' +
      '<polygon points="76,40 66,58 84,58" fill="#E2E8F0" fill-opacity=".45"/>';
  } else if (kind === 'drops') {
    for (let i = 1; i <= 4; i++) s += '<circle cx="60" cy="62" r="' + (i * 10) + '" fill="none" stroke="' + color + '" stroke-opacity="' + (0.7 - i * 0.14).toFixed(2) + '" stroke-width="1.2"/>';
    s += '<circle cx="60" cy="62" r="4" fill="#E2E8F0" fill-opacity=".85"/>' +
      '<circle cx="' + (30 + rnd() * 10).toFixed(1) + '" cy="30" r="2.4" fill="' + color + '" fill-opacity=".8"/><circle cx="' + (80 + rnd() * 12).toFixed(1) + '" cy="36" r="1.8" fill="' + color + '" fill-opacity=".7"/>';
  } else if (kind === 'sprout') {
    const lean = (rnd() - 0.5) * 16;
    s += '<line x1="16" y1="100" x2="104" y2="100" stroke="' + color + '" stroke-opacity=".5"/>' +
      '<path d="M60 100 C60 80 ' + (60 + lean) + ' 64 ' + (60 + lean) + ' 44" fill="none" stroke="#E2E8F0" stroke-opacity=".7" stroke-width="1.6"/>' +
      '<ellipse cx="' + (60 + lean - 11) + '" cy="52" rx="11" ry="5" transform="rotate(-28 ' + (60 + lean - 11) + ' 52)" fill="' + color + '" fill-opacity=".55" stroke="#E2E8F0" stroke-opacity=".4" stroke-width=".6"/>' +
      '<ellipse cx="' + (60 + lean + 11) + '" cy="46" rx="11" ry="5" transform="rotate(28 ' + (60 + lean + 11) + ' 46)" fill="' + color + '" fill-opacity=".55" stroke="#E2E8F0" stroke-opacity=".4" stroke-width=".6"/>';
  } else { // glow
    s += '<circle cx="60" cy="60" r="52" fill="url(#' + id + 'g)"/>' +
      '<polygon points="60,40 74,60 60,80 46,60" fill="' + color + '" fill-opacity=".6" stroke="#E2E8F0" stroke-opacity=".8" stroke-width="1"/>' +
      '<circle cx="60" cy="60" r="3" fill="#E2E8F0"/>';
  }
  return s + '</svg>';
}

const tg = (window.Telegram && window.Telegram.WebApp) || null;

function atLeast(v) {
  try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; }
}

  try { if (inTG && atLeast('6.1') && S.settings.haptic !== false) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
}

function applyInsets() {
  let top = 0;
  try {
    const sa = tg.safeAreaInset || {};
    const ca = tg.contentSafeAreaInset || {};
    top = (sa.top || 0) + (ca.top || 0);
    if (tg.isFullscreen && top < 60) top = 100; // запас, если клиент не прислал отступы
  } catch (e) {}
  document.documentElement.style.setProperty('--app-top', top + 'px');
}

function setupTelegram() {
  if (!tg) return;
  try { tg.ready(); } catch (e) {}
  if (!inTG) return;
  try { tg.expand(); } catch (e) {}
  try { if (atLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  try { if (atLeast('6.9')) { tg.setHeaderColor('#0A0A0C'); tg.setBackgroundColor('#0A0A0C'); } } catch (e) {}
  try { if (atLeast('7.10')) tg.setBottomBarColor('#0A0A0C'); } catch (e) {}
  // Полный экран включается ссылкой ...?startapp=fs (по умолчанию выключен — безопаснее для вёрстки).
  const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const wantFs = sp === 'fs' || /[?&]fs=1/.test(location.search);
  try {
    if (wantFs && atLeast('8.0') && (tg.platform === 'ios' || tg.platform === 'android')) tg.requestFullscreen();
  } catch (e) {}
  try {
    tg.onEvent('fullscreenChanged', applyInsets);
    tg.onEvent('safeAreaChanged', applyInsets);
    tg.onEvent('contentSafeAreaChanged', applyInsets);
  } catch (e) {}
  applyInsets();
  try { if (atLeast('6.1')) tg.BackButton.onClick(() => back()); } catch (e) {}
}

// ───────── Хранилище: CloudStorage Telegram + запасной localStorage ─────────
const PROFILES_KEY = 'lumina_profiles';
const LOG_PREFIX = 'lumina_log_';
const MAX_PROFILES = 12;
const MAX_NAME = 24;
const MAX_TEXT = 120;
const MAX_BYTES = 3900; // лимит CloudStorage — 4096 байт на значение

const cloud = inTG && atLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
const byteLen = (s) => new TextEncoder().encode(s).length;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const lsKeys = (prefix) => {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) out.push(k);
    }
  } catch (e) {}
  return out;
};

const store = {
  async get(k) {
    if (cloud) {
      const v = await new Promise((res) => {
        try { cloud.getItem(k, (e, val) => res(e ? null : val || null)); } catch (e) { res(null); }
      });
      if (v !== null) return v;
    }
    return lsGet(k);
  },
  async set(k, v) {
    lsSet(k, v);
    if (cloud) {
      await new Promise((res) => {
        try { cloud.setItem(k, v, () => res()); } catch (e) { res(); }
      });
    }
  },
  async remove(keys) {
    keys.forEach(lsDel);
    if (cloud && keys.length) {
      await new Promise((res) => {
        try { cloud.removeItems(keys, () => res()); } catch (e) { res(); }
      });
    }
  },
  async keys(prefix) {
    const set = new Set(lsKeys(prefix));
    if (cloud) {
      const ks = await new Promise((res) => {
        try { cloud.getKeys((e, arr) => res(e ? [] : arr || [])); } catch (e) { res([]); }
      });
      ks.forEach((k) => { if (k.indexOf(prefix) === 0) set.add(k); });
    }
    return Array.from(set);
  },
};

const newId = () => 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
const dayStamp = (d) => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
const logKey = (pid, d) => LOG_PREFIX + pid + '_' + dayStamp(d);
const toEntry = (pid, o) => ({
  id: 'e' + o.t, profileId: pid, text: o.x || '', timestamp: new Date(o.t).toISOString(), registerId: o.r, kind: o.v || 'x', art: o.a || 0,
});

async function loadProfiles() {
  try { const raw = await store.get(PROFILES_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
}
async function saveProfiles(list) {
  const raw = JSON.stringify(list);
  if (byteLen(raw) > MAX_BYTES) throw new Error('limit');
  await store.set(PROFILES_KEY, raw);
}
async function loadDay(pid, d) {
  try {
    const raw = await store.get(logKey(pid, d));
    return raw ? JSON.parse(raw).map((o) => toEntry(pid, o)) : [];
  } catch (e) { return []; }
}
async function loadAllLogs(pid) {
  try {
    const keys = await store.keys(LOG_PREFIX + pid + '_');
    const raws = await Promise.all(keys.map((k) => store.get(k)));
    const out = [];
    raws.forEach((raw) => { if (raw) JSON.parse(raw).forEach((o) => out.push(toEntry(pid, o))); });
    return out;
  } catch (e) { return []; }
}
async function addLogEntry(pid, rec) {
  const now = new Date();
  const key = logKey(pid, now);
  const raw = await store.get(key);
  const arr = raw ? JSON.parse(raw) : [];
  const item = { t: now.getTime(), r: rec.r };
  if (rec.v) item.v = rec.v;
  if (rec.a) item.a = rec.a;
  if (rec.x) item.x = rec.x;
  arr.push(item);
  const out = JSON.stringify(arr);
  if (byteLen(out) > MAX_BYTES) throw new Error('limit');
  await store.set(key, out);
  return arr.map((o) => toEntry(pid, o));
}
async function deleteProfileData(pid) {
  const keys = await store.keys(LOG_PREFIX + pid + '_');
  await store.remove(keys);
}

/** Текущая пентада по долготе Солнца и время до её конца (по мгновенной скорости Солнца). */
function pentadState(now) {
  const lam = calculateSunLongitude(now);
  const id = Math.max(1, Math.min(REGISTER_COUNT, Math.floor(lam / PENTAD_DEG) + 1));
  const into = lam - (id - 1) * PENTAD_DEG;
  const remainDeg = Math.max(0, PENTAD_DEG - into);
  let speed = calculateSunLongitude(new Date(now.getTime() + 3600000)) - lam; // °/час
  if (speed < 0) speed += 360;
  if (!(speed > 0.01)) speed = 0.041;
  return { id, frac: remainDeg / PENTAD_DEG, msToEnd: (remainDeg / speed) * 3600000, lenMs: (PENTAD_DEG / speed) * 3600000 };
}
function fmtLeft(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  if (d >= 1) return { big: d + ' д', small: h + ' ч' };
  if (h >= 1) return { big: h + ' ч', small: mi + ' м' };
  return { big: mi + ' м', small: '' };
}
function fmtLeftFull(ms) {
  const l = fmtLeft(ms);
  return l.small ? l.big + ' ' + l.small : l.big;
}
function fmtMoment(d) {
  return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ', ' + formatClock(d);
}

/** Ближайший маяк: 00:00, 01:01, ... 23:23 (минута маяка длится 60 секунд). */
function nextBeacon(now) {
  const sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  for (let h = 0; h < 24; h++) {
    const bs = 61 * h * 60;
    if (sec >= bs && sec < bs + 60) return { h, isNow: true, secTo: 0 };
  }
  for (let h = 0; h < 24; h++) {
    const bs = 61 * h * 60;
    if (bs > sec) return { h, isNow: false, secTo: bs - sec };
  }
  return { h: 0, isNow: false, secTo: 86400 - sec };
}
function fmtBeaconIn(sec) {
  const m = Math.max(1, Math.ceil(sec / 60));
  if (m < 60) return m + ' мин';
  return m % 60 === 0 ? (m / 60) + ' ч' : Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин';
}

function fitBeaconRow() {
  const row = document.querySelector('.beacon-row');
  if (!row) return;
  const r = row.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if (!w || !h) return;
  const svg = row.querySelector('.br-svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  row.querySelectorAll('rect').forEach((rc) => {
    rc.setAttribute('x', '1'); rc.setAttribute('y', '1');
    rc.setAttribute('width', String(w - 2)); rc.setAttribute('height', String(h - 2));

}

function entryParts(l) {

}
function entryHTML(l, withArrow) {
  const reg = getRegister(l.registerId);

/** Суточный диск: 72 деления, полночь сверху; пройденные окна ярче, текущее выделено. */
function dialSVG(activeId) {
  const c = 110;
  let lines = '';
  REGISTERS.forEach((r) => {
    const a = ((r.id - 0.5) / REGISTER_COUNT) * 2 * Math.PI - Math.PI / 2;
    const now = r.id === activeId;
    const outer = c - 6;
    const inner = now ? c - 28 : c - 20;
    lines += '<line x1="' + (c + inner * Math.cos(a)).toFixed(2) + '" y1="' + (c + inner * Math.sin(a)).toFixed(2) +
      '" x2="' + (c + outer * Math.cos(a)).toFixed(2) + '" y2="' + (c + outer * Math.sin(a)).toFixed(2) +
      '" stroke="' + (now ? '#E2E8F0' : col(r)) + '" stroke-opacity="' + (now ? 1 : r.id < activeId ? 0.95 : 0.26) +
      '" stroke-width="' + (now ? 4 : 3) + '" stroke-linecap="round"/>';
  });
  return '<svg viewBox="0 0 220 220">' + lines + '</svg>';
}

function pentHTML(ps) {

    '<div class="pring-c"><div class="pbig" data-live="pbig">' + l.big + '</div><div class="psmall" data-live="psmall">' + l.small + '</div></div></div>' +

// ───────── Экраны ─────────
const OCT_PTS = (cx, cy, r, rot) => Array.from({ length: 8 }, (_, i) => {
  const a = rot + (i / 8) * 2 * Math.PI;
  return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
}).join(' ');

function startBgHTML() {
  const big = '<svg class="start-oct" viewBox="0 0 400 400"><defs><radialGradient id="stg" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0" stop-color="#2447D8" stop-opacity=".3"/><stop offset="1" stop-color="#2447D8" stop-opacity="0"/></radialGradient></defs>' +
    '<circle cx="200" cy="200" r="200" fill="url(#stg)"/>' +
    '<polygon points="' + OCT_PTS(200, 200, 176, Math.PI / 8) + '" fill="none" stroke="#E2E8F0" stroke-opacity=".24" stroke-width="1.2"/>' +
    '<polygon points="' + OCT_PTS(200, 200, 134, Math.PI / 8) + '" fill="none" stroke="#E2E8F0" stroke-opacity=".13" stroke-width="1"/>' +
    '<polygon points="' + OCT_PTS(200, 200, 92, Math.PI / 8) + '" fill="none" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/></svg>';
  // сетка: восьмигранники со стороной a и малые квадраты между ними
  const a = 22, S = a * (1 + Math.SQRT2), R = a / (2 * Math.sin(Math.PI / 8)), d = a / Math.SQRT2;
  const dia = (x, y) => x.toFixed(1) + ',' + (y - d).toFixed(1) + ' ' + (x + d).toFixed(1) + ',' + y.toFixed(1) + ' ' + x.toFixed(1) + ',' + (y + d).toFixed(1) + ' ' + (x - d).toFixed(1) + ',' + y.toFixed(1);
  const polys = ['<polygon points="' + OCT_PTS(S / 2, S / 2, R, Math.PI / 8) + '"/>']
    .concat([[0, 0], [S, 0], [0, S], [S, S]].map((p) => '<polygon points="' + dia(p[0], p[1]) + '"/>')).join('');
  const grid = '<svg preserveAspectRatio="none"><defs><pattern id="octp" width="' + S.toFixed(2) + '" height="' + S.toFixed(2) + '" patternUnits="userSpaceOnUse">' +
    '<g fill="none" stroke="#FFFFFF" stroke-width=".9">' + polys + '</g></pattern></defs><rect width="100%" height="100%" fill="url(#octp)"/></svg>';
  return '<div class="start-bg">' + big + '<div class="start-gridwrap">' + grid + '</div></div>';
}

      '<div class="d-timer"><div class="label">До смены окна осталось:</div><div class="big" style="color:' + color + '" data-live="count">' +

  }

      sec('Типичный перекос', reg.typical_distortion) + sec('Практика на день', reg.daily_practice);

    html += '<button class="btn btn-pro" data-action="open-pro" data-k="window"><span>ПОЛНАЯ РАЗВЁРТКА 20 МИН</span><span class="pro-badge">PRO</span></button>' +

    const sg = seasonOf(reg.id);

    html += '<div class="section">Сезон · ' + esc(sg.sign.n) + '</div><div class="card"><div class="d-vec" style="margin:0 0 8px">' + esc(sg.sign.t) +

      ' — ' + esc(nextReg.vector_title) + '</div></div>';
  }
  if (isWin) {
    const prev = getRegister(reg.id === 1 ? REGISTER_COUNT : reg.id - 1);
    const next = getRegister(reg.id === REGISTER_COUNT ? 1 : reg.id + 1);

function elementRuns(element) {
  const runs = [];
  let start = null, prev = null;
  REGISTERS.forEach((r) => {
    if (r.element === element) { if (!start) start = r; prev = r; }
    else if (start) { runs.push(start.time_window_start + '–' + prev.time_window_end); start = null; }
  });
  if (start) runs.push(start.time_window_start + '–' + prev.time_window_end);
  return runs;
}

const KEEP_IDS = ['quickDate', 'profName', 'profDate'];
let liveTimer = null;
let liveActive = null;
let liveMeso = null;
let liveBeacon = false;

function render(animate) {
  const route = cur();
  if (animate) closeOverlay();
  if (animate) { S.winsOpen = false; S.beaconsOpen = false; S.quickOpen = S.profiles.length === 0; }
  const kept = {};
  if (!animate) {
    KEEP_IDS.forEach((id) => {
      const el = document.getElementById(id);
      if (el) kept[id] = { v: el.value, f: document.activeElement === el };
    });
  }
  const scroll = window.scrollY;
  let body = '';
  if (route.name === 'start') body = startHTML();
  else if (route.name === 'soon') body = soonHTML(route);
  else if (route.name === 'home') body = homeHTML();
  else if (route.name === 'create') body = createHTML(route);
  else if (route.name === 'quick' || route.name === 'profile') body = dashboardHTML(route);
  else if (route.name === 'detail') body = detailHTML(route);
  else if (route.name === 'pro') body = proHTML(route);
  else if (route.name === 'beacon') body = beaconHTML(route);
  else if (route.name === 'edit') body = editHTML(route);
  else if (route.name === 'journal') body = journalHTML(route);
  $app.innerHTML = '<div class="screen' + (animate ? ' enter' : '') + '">' + body + '</div>' + sheetHTML();
  KEEP_IDS.forEach((id) => {
    const el = document.getElementById(id);
    if (el && kept[id]) { el.value = kept[id].v; if (kept[id].f) el.focus(); }
  });
  window.scrollTo(0, animate ? 0 : scroll);
  fitBeaconRow();
  syncBackButton();
  startLive();
}

function startLive() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = null;
  const route = cur();
  if (!document.querySelector('[data-live]')) return;
  const isDash = route.name === 'quick' || route.name === 'profile';
  const watchWin = isDash || (route.name === 'detail' && route.kind === 'window');
  const watchPent = isDash || (route.name === 'detail' && route.kind === 'meso');
  liveActive = getActiveRegisterId(new Date());
  liveMeso = pentadState(new Date()).id;
  liveBeacon = nextBeacon(new Date()).isNow;
  const WCIRC = 2 * Math.PI * 142, PCIRC = 2 * Math.PI * 42;
  const setText = (sel, v) => document.querySelectorAll(sel).forEach((el) => { if (el.textContent !== v) el.textContent = v; });
  liveTimer = setInterval(() => {
    const now = new Date();
    if (watchWin && getActiveRegisterId(now) !== liveActive) { render(false); return; }
    const ps = pentadState(now);
    if (watchPent && ps.id !== liveMeso) { render(false); return; }
    const nb = nextBeacon(now);
    if (isDash && nb.isNow !== liveBeacon) { render(false); return; }
    const ms = getMsToWindowEnd(now);
    const frac = Math.min(1, Math.max(0, ms / (WINDOW_MIN * 60000)));
    document.querySelectorAll('.arc, .arc-glow').forEach((c) => c.setAttribute('stroke-dashoffset', String(WCIRC * (1 - frac))));
    document.querySelectorAll('.parc, .parc-glow').forEach((c) => c.setAttribute('stroke-dashoffset', String(PCIRC * (1 - ps.frac))));
    setText('[data-live="count"]', formatCountdown(Math.ceil(ms / 1000)));
    setText('[data-live="clock"]', formatClock(now));
    const brow = document.querySelector('.beacon-row');
    if (brow) { brow.classList.toggle('now', nb.isNow); brow.classList.toggle('near', !nb.isNow && nb.secTo <= 60); }
    const bp = beaconParts(nb);
    setText('[data-live="bl-a"]', bp.a);
    setText('[data-live="bl-t"]', bp.t);
    setText('[data-live="bl-b"]', bp.b);
    document.querySelectorAll('.beacon-row').forEach((el) => { el.dataset.h = String(nb.h); });
    const l = fmtLeft(ps.msToEnd);
    setText('[data-live="pbig"]', l.big);
    setText('[data-live="psmall"]', l.small);
    setText('[data-live="pcount"]', fmtLeftFull(ps.msToEnd));
  }, 200);
}

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function setError(id, msg) { const el = document.getElementById(id); if (el) el.textContent = msg; }

// ───────── Действия ─────────
function maskDate(text) {
  const d = text.replace(/\D/g, '').slice(0, 8);
  if (d.length > 4) return d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4);
  if (d.length > 2) return d.slice(0, 2) + '.' + d.slice(2);
  return d;
}

function quickCalc() {
  const v = val('quickDate');
  const p = parseBirthDate(v);
  if (!p) { setError('quickErr', 'Неверная дата. Формат: ДД.ММ.ГГГГ'); return; }
  haptic('light');
  S.sessionLogs = [];
  S.axisOpen = false;
  go({ name: 'quick', birthDate: v, nPhys: calculatePhysicalRegister(birthDateToUTC(p)), nEvol: calculateEvolutionaryRegister(p.year) });
}

async function saveProfile() {
  const name = val('profName').trim();
  const date = val('profDate');
  if (!name) { setError('createErr', 'Введи имя профиля.'); return; }
  const p = parseBirthDate(date);
  if (!p) { setError('createErr', 'Неверная дата. Формат: ДД.ММ.ГГГГ'); return; }
  if (S.profiles.length >= MAX_PROFILES) { setError('createErr', 'Максимум профилей: ' + MAX_PROFILES + '.'); return; }
  const profile = {
    id: newId(), name: name.slice(0, MAX_NAME), birthDate: date,
    nPhys: calculatePhysicalRegister(birthDateToUTC(p)), nEvol: calculateEvolutionaryRegister(p.year),
    createdAt: new Date().toISOString(),
  };
  try { await saveProfiles(S.profiles.concat([profile])); } catch (e) { setError('createErr', 'Не удалось сохранить профиль.'); return; }
  S.profiles.push(profile);
  S.lastLog = null;
  S.axisOpen = false;
  haptic('medium');
  replaceAll([{ name: 'start' }, { name: 'home' }, { name: 'profile', id: profile.id }]);
}

async function handle(action, el) {
  switch (action) {
    case 'back': haptic('light'); back(); break;
    case 'quick': quickCalc(); break;
    case 'create': go({ name: 'create', initialDate: '' }); break;
    case 'save-as-profile': go({ name: 'create', initialDate: cur().birthDate || '' }); break;
    case 'save-profile': await saveProfile(); break;
    case 'toggle-quick': {
      const acc = document.getElementById('quickAcc');
      if (!acc) break;
      const open = !acc.classList.contains('open');
      acc.classList.toggle('open', open);
      S.quickOpen = open;
      if (open) { const inp = document.getElementById('quickDate'); if (inp) inp.focus(); }
      haptic('light');
      break;
    }
    case 'toggle-axis': {
      const acc = document.getElementById('axisAcc');
      if (!acc) break;
      const open = !acc.classList.contains('open');
      acc.classList.toggle('open', open);
      S.axisOpen = open;
      haptic('light');
      break;
    }
    case 'toggle-wins': {
      const acc = document.getElementById('winsAcc');
      if (!acc) break;
      const open = !acc.classList.contains('open');
      acc.classList.toggle('open', open);
      S.winsOpen = open;
      if (open) setTimeout(() => { const el = document.getElementById('winNow'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 330);
      haptic('light');
      break;
    }
    case 'open-pro': haptic('light'); go({ name: 'pro', kind: el.dataset.k || (cur().name === 'beacon' ? 'beacon' : cur().kind), ctx: cur().ctx, h: cur().h }); break;
    case 'open-beacon': haptic('light'); go({ name: 'beacon', h: parseInt(el.dataset.h, 10) }); break;
    case 'toggle-beacons': {
      const acc = document.getElementById('beaconsAcc');
      if (!acc) break;
      const open = !acc.classList.contains('open');
      acc.classList.toggle('open', open);
      S.beaconsOpen = open;
      haptic('light');
      break;
    }
    case 'open-profile': {
      const id = el.dataset.id;
      S.axisOpen = false;
      const all = await loadAllLogs(id);
      S.lastLog = all.reduce((a, b) => (!a || b.timestamp > a.timestamp ? b : a), null);
      haptic('light');
      go({ name: 'profile', id });
      break;
    }
    case 'open-detail': {
      const route = cur();
      const kind = el.dataset.kind;
      const base = route.name === 'profile' ? S.profiles.find((p) => p.id === route.id) : route;
      const regId = kind === 'phys' ? base.nPhys : kind === 'evol' ? base.nEvol : 0;
      haptic('light');
      go({ name: 'detail', kind, regId, ctx: { nPhys: base.nPhys, nEvol: base.nEvol } });
      break;
    }
    case 'open-journal': {
      const route = cur();
      S.journal = await loadAllLogs(route.id);
      S.openGroups = {};
      haptic('light');
      go({ name: 'journal', id: route.id });
      break;
    }
    case 'toggle': {
      const key = el.dataset.key;
      const def = el.dataset.def === '1';
      S.openGroups[key] = !(key in S.openGroups ? S.openGroups[key] : def);
      haptic('light');
      render(false);
      break;
    }
    case 'ask-delete': S.confirmId = el.dataset.id; render(false); break;
    case 'cancel-delete': S.confirmId = null; render(false); break;
    case 'confirm-delete': {
      const id = S.confirmId;
      S.confirmId = null;
      try {
        await deleteProfileData(id);
        S.profiles = S.profiles.filter((p) => p.id !== id);
        await saveProfiles(S.profiles);
      } catch (e) { toast('Не удалось удалить профиль'); }
      haptic('medium');
      render(false);
      break;
    }
    case 'soon': haptic('light'); openSoon(); break;
    case 'go-calib': haptic('light'); go({ name: 'home' }); break;
    case 'go-soon': haptic('light'); go({ name: 'soon', title: el.dataset.t || '' }); break;
    case 'ground': {
      const regId = getActiveRegisterId(new Date());
      haptic('light');
      if (el.dataset.v === 'f') openFood(regId);
      else if (el.dataset.v === 'm') openMove(regId);
      else openResonance(regId);
      break;
    }
    case 'ov-close': case 'res-close': closeOverlay(); break;
    case 'food-done': { const r = parseInt(el.dataset.r, 10); closeOverlay(); haptic('medium'); await logGround('f', r); break; }
    case 'move-start': startMove(parseInt(el.dataset.r, 10)); break;
    case 'res-pick': pickResonance(parseInt(el.dataset.r, 10), parseInt(el.dataset.a, 10)); break;
    case 'open-settings': haptic('light'); openSettings(); break;
    case 'toggle-sound': S.settings.sound = S.settings.sound === false; el.classList.toggle('on', S.settings.sound); await saveSettings(); break;
    case 'toggle-haptic': S.settings.haptic = S.settings.haptic === false; el.classList.toggle('on', S.settings.haptic); await saveSettings(); haptic('light'); break;
    case 'edit-profile': go({ name: 'edit', id: cur().id }); break;
    case 'update-profile': await updateProfile(); break;
    default: break;
  }
}

  if (e.target.id === 'quickDate') { e.preventDefault(); quickCalc(); }
});
// Долгое нажатие на профиль открывает окно «Удалить / Отмена».
const lpCancel = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
document.addEventListener('pointerdown', (e) => {
  const row = e.target.closest && e.target.closest('.prow');
  if (!row) return;
  lpStart = { x: e.clientX, y: e.clientY };
  lpCancel();
  lpTimer = setTimeout(() => {
    lpTimer = null;
    lpSuppress = true;
    setTimeout(() => { lpSuppress = false; }, 450);
    haptic('medium');
    S.confirmId = row.dataset.id;
    render(false);
  }, 550);
});
document.addEventListener('pointermove', (e) => {
  if (lpTimer && lpStart && (Math.abs(e.clientX - lpStart.x) > 10 || Math.abs(e.clientY - lpStart.y) > 10)) lpCancel();
});
['pointerup', 'pointercancel'].forEach((ev) => document.addEventListener(ev, lpCancel, true));
window.addEventListener('scroll', lpCancel, true);
document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('.prow')) e.preventDefault(); });

document.addEventListener('focusin', (e) => {
  if (e.target && e.target.tagName === 'INPUT') {
    setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 320);
  }
});

const ov = { el: null, stop: null };
function ovEl() {
  if (!ov.el) { ov.el = document.createElement('div'); ov.el.id = 'ov'; document.body.appendChild(ov.el); }
  return ov.el;
}
function closeOverlay() {
  if (ov.stop) { try { ov.stop(); } catch (e) {} ov.stop = null; }
  if (ov.el) ov.el.innerHTML = '';
}
const sheetWrap = (inner) => '<div class="backdrop" data-action="ov-close"><div class="sheet" data-action="noop">' + inner + '</div></div>';

async function saveSettings() {
  try { await store.set(SETTINGS_KEY, JSON.stringify(S.settings)); } catch (e) {}
}

/** Короткий глубокий аккорд (синтез в приложении, без аудиофайла). */
function playChord(sec) {
  if (S.settings.sound === false) return () => {};
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return () => {};
    const ctx = new Ctx();
    if (ctx.state === 'suspended') ctx.resume();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    const t0 = ctx.currentTime;
    master.gain.linearRampToValueAtTime(0.2, t0 + 1.8);
    master.gain.setValueAtTime(0.2, t0 + sec - 3.5);
    master.gain.linearRampToValueAtTime(0, t0 + sec);
    [[216, 0.5], [324, 0.32], [432, 0.5], [648, 0.16]].forEach((n) => {
      [0, 0.6].forEach((detune) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = n[0] + detune;
        g.gain.value = n[1] * 0.5;
        o.connect(g); g.connect(master);
        o.start(t0);
        o.stop(t0 + sec + 0.2);
      });
    });
    return () => {
      try {
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
        setTimeout(() => { try { ctx.close(); } catch (e) {} }, 500);
      } catch (e) {}
    };
  } catch (e) { return () => {}; }
}

async function logGround(v, regId, art) {
  const route = cur();
  const rec = { v, r: regId };
  if (art) rec.a = art;
  if (route.name === 'profile') {
    try {
      const all = await addLogEntry(route.id, rec);
      S.lastLog = all[all.length - 1] || null;
    } catch (e) { toast('Лимит записей за день достигнут'); return false; }
  } else {
    S.sessionLogs.unshift({ id: 's' + Date.now(), profileId: '', text: '', kind: v, art: art || 0, timestamp: new Date().toISOString(), registerId: regId });
  }
  render(false);
  toast('Записано');
  return true;
}

function openSoon() {
  ovEl().innerHTML = sheetWrap('<h3>В разработке</h3><div class="body">Эта функция появится в одной из следующих версий.</div>' +
    '<div class="sheet-row"><button class="btn btn-cancel" data-action="ov-close">ЗАКРЫТЬ</button></div>');
}

function openFood(regId) {
  const m = MATRIX[regId - 1];
  ovEl().innerHTML = sheetWrap('<div class="label">Питание · №' + regId + ' ' + m[0] + betaTag(regId) + '</div>' +
    '<div class="sheet-big">' + esc(m[2]) + '</div>' +
    '<div class="note">Подсказка, а не рекомендация врача: учитывай аллергии и своё состояние.</div>' +
    '<div class="sheet-row"><button class="btn btn-cancel" data-action="ov-close">ЗАКРЫТЬ</button>' +
    '<button class="btn btn-ok" data-action="food-done" data-r="' + regId + '">ПРИНЯЛ</button></div>');
}

function openMove(regId) {
  const m = MATRIX[regId - 1];
  ovEl().innerHTML = sheetWrap('<div class="label">Движение · №' + regId + ' ' + m[0] + betaTag(regId) + '</div>' +
    '<div class="sheet-big">' + esc(m[3]) + '</div>' +
    '<div class="note">Двигайся мягко, без боли. Подсказка не заменяет рекомендации врача.</div>' +
    '<div class="sheet-row"><button class="btn btn-cancel" data-action="ov-close">ЗАКРЫТЬ</button>' +
    '<button class="btn btn-ok" data-action="move-start" data-r="' + regId + '">НАЧАТЬ · 15 СЕК</button></div>');
}

function startMove(regId) {
  const total = 15000, t0 = Date.now(), m = MATRIX[regId - 1];
  ovEl().innerHTML = sheetWrap('<div class="label">Движение · №' + regId + ' ' + m[0] + '</div>' +
    '<div class="sheet-big" style="font-size:16px">' + esc(m[3]) + '</div>' +
    '<div class="move-timer"><div class="mt-num" id="mtNum">15</div><div class="mt-bar"><i id="mtBar"></i></div></div>' +
    '<div class="sheet-row"><button class="btn btn-cancel" data-action="ov-close">ОТМЕНА</button></div>');
  const timers = [];
  [0, 5000, 10000].forEach((d) => timers.push(setTimeout(() => haptic(d === 0 ? 'medium' : 'light'), d)));
  const iv = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - t0));
    const num = document.getElementById('mtNum');
    const bar = document.getElementById('mtBar');
    if (num) num.textContent = String(Math.ceil(left / 1000));
    if (bar) bar.style.width = ((1 - left / total) * 100).toFixed(1) + '%';
    if (left <= 0) { clearInterval(iv); closeOverlay(); haptic('medium'); logGround('m', regId); }
  }, 200);
  ov.stop = () => { clearInterval(iv); timers.forEach(clearTimeout); };
}

function openResonance(regId) {
  const ids = [regId, ((regId - 1 + 24) % 72) + 1, ((regId - 1 + 48) % 72) + 1];
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  }
  ovEl().innerHTML = '<div class="res"><button class="res-x" data-action="res-close" aria-label="Закрыть">×</button>' +
    '<div class="res-cap">ВЫБЕРИ ОБРАЗ</div><div class="res-tri">' +
    ids.map((i) => '<button class="res-card" data-action="res-pick" data-r="' + regId + '" data-a="' + i + '">' + artSVG(i, 104) + '</button>').join('') +
    '</div></div>';
}

function pickResonance(regId, artId) {
  const text = MATRIX[regId - 1][5];
  const lines = text.match(/[^.!?]+[.!?]+/g) || [text];
  ovEl().innerHTML = '<div class="res full"><button class="res-x" data-action="res-close" aria-label="Закрыть">×</button>' +
    '<div class="res-art">' + artSVG(artId, 260) + '</div>' +
    '<div class="res-thought">' + lines.map((t, i) => '<div class="tl" style="animation-delay:' + (1.2 + i * 2.4).toFixed(1) + 's">' + esc(t.trim()) + '</div>').join('') + '</div>' +
    '<div class="res-bar"><i></i></div></div>';
  const stopSound = playChord(15);
  const timers = [];
  [[0, 'soft'], [4000, 'light'], [10000, 'soft'], [14000, 'light']].forEach((p) => timers.push(setTimeout(() => haptic(p[1]), p[0])));
  timers.push(setTimeout(() => { closeOverlay(); logGround('r', regId, artId); }, 15000));
  ov.stop = () => { timers.forEach(clearTimeout); stopSound(); };
}

function openSettings() {
  const sw = (action, on, label) => '<div class="setrow"><span>' + label + '</span><button class="sw' + (on ? ' on' : '') + '" data-action="' + action + '" aria-label="' + label + '"><i></i></button></div>';
  ovEl().innerHTML = sheetWrap('<h3>Настройки</h3>' + sw('toggle-sound', S.settings.sound !== false, 'Звук') + sw('toggle-haptic', S.settings.haptic !== false, 'Вибрация') +
    '<div class="sheet-row"><button class="btn btn-cancel" data-action="ov-close">ЗАКРЫТЬ</button></div>');
}

function editHTML(route) {
  const p = S.profiles.find((x) => x.id === route.id);
  if (!p) return '<div class="empty">Профиль не найден.</div>';
  return topbar('Изменить профиль', { noClock: true }) +
    '<div class="card" style="margin-top:20px">' +
    '<div class="label field-label">Имя профиля</div>' +
    '<input class="input" id="profName" maxlength="' + MAX_NAME + '" value="' + esc(p.name) + '" autocomplete="off">' +
    '<div class="label field-label" style="margin-top:18px">Дата рождения</div>' +
    '<input class="input" id="profDate" data-mask="date" inputmode="numeric" maxlength="10" value="' + esc(p.birthDate) + '" autocomplete="off">' +
    '<div class="error" id="createErr"></div>' +
    '<button class="btn btn-solid" data-action="update-profile">СОХРАНИТЬ</button></div>';
}

async function updateProfile() {
  const route = cur();
  const name = val('profName').trim();
  const date = val('profDate');
  if (!name) { setError('createErr', 'Введи имя профиля.'); return; }
  const p = parseBirthDate(date);
  if (!p) { setError('createErr', 'Неверная дата. Формат: ДД.ММ.ГГГГ'); return; }
  const idx = S.profiles.findIndex((x) => x.id === route.id);
  if (idx < 0) return;
  const upd = Object.assign({}, S.profiles[idx], {
    name: name.slice(0, MAX_NAME), birthDate: date,
    nPhys: calculatePhysicalRegister(birthDateToUTC(p)), nEvol: calculateEvolutionaryRegister(p.year),
  });
  const list = S.profiles.slice();
  list[idx] = upd;
  try { await saveProfiles(list); } catch (e) { setError('createErr', 'Не удалось сохранить.'); return; }
  S.profiles = list;
  haptic('medium');
  back();
  toast('Сохранено');
}

// ───────── Запуск ─────────
(async function init() {
  setupTelegram();
  try { const raw = await store.get(SETTINGS_KEY); if (raw) Object.assign(S.settings, JSON.parse(raw)); } catch (e) {}
  S.profiles = await loadProfiles();
  render(true);
})();

})();
